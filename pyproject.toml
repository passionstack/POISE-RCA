[project]
name = "poise-rca"
version = "0.1.0"
description = "Evidence-grounded root-cause diagnosis under partial observability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langfuse>=5,<6",
    "langgraph>=1,<2",
    "networkx>=3.4,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pyyaml>=6,<7",
    "rcaeval>=1.5,<2",
    "scikit-learn>=1.6,<2",
    "tqdm>=4.67,<5",
    "typer>=0.15,<1",
]

[project.scripts]
poise-rca = "poise_rca.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-networkx>=3.4,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["poise_rca"]
